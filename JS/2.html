<!DOCTYPE html>
<html>
<head>
  <title>Variables & Data Types</title>
</head>
<body>
  <h2>Check Console for Output</h2>

  <script>
    // Variables & Data Types in JavaScript

    // Declare variables
    let name = "Rakshita";   // String
    let age = 20;            // Number
    let isStudent = true;    // Boolean

    // Print variables
    console.log("Name:", name);
    console.log("Age:", age);
    console.log("Is Student:", isStudent);

    // Check data types using typeof
    console.log("Type of name:", typeof name);       // string
    console.log("Type of age:", typeof age);         // number
    console.log("Type of isStudent:", typeof isStudent); // boolean
  </script>
</body>
</html>
